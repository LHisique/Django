{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alteração de Contato</title>
    {% bootstrap_css %}
</head>

<body>
    <div class="container">
        <h1 class="alert alert-info mt-3">Alteração de Contato</h1>

        <form action="{% url 'altContato' contato.id %}" method="post" enctype="multipart/form-data" class="form">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">Salvar Alteração</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Voltar</a>
        </form>
    </div>
    {% bootstrap_javascript %}
</body>

</html>

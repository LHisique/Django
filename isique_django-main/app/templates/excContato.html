{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusão de Contato</title>
    {% bootstrap_css %}
</head>

<body>
    <div class="container mt-4">
        <div class="alert alert-danger">
            <h2>Confirma exclusão? Esse processo é irreversível.</h2>
        </div>

        <div class="card p-3 mb-3">
            <p><strong>Nome:</strong> {{ contato.Nome }}</p>
            <p><strong>E-mail:</strong> {{ contato.Email }}</p>
            <p><strong>Data de Nascimento:</strong> {{ contato.DtaNas }}</p>
        </div>

        <form action="{% url 'excContato' contato.id %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    {% bootstrap_javascript %}
</body>

</html>
